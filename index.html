 <style>
   :root {
     color-scheme: dark;
     --ink: #f4f8f5;
     --muted: #95a39d;
     --page: #07110f;
     --panel: #0e1a17;
     --panel-2: #13221e;
     --line: rgba(224, 244, 234, 0.13);
     --accent: #c7ff3d;
     --accent-ink: #102000;
     --warn: #ffce55;
     --danger: #ff6f70;
     --score-angle: 0deg;
     font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
       "Segoe UI", "Noto Sans TC", sans-serif;
   }


   * { box-sizing: border-box; }


   html, body { min-height: 100%; }


   body {
     margin: 0;
     min-width: 280px;
     background:
       radial-gradient(circle at 15% -10%, rgba(85, 178, 124, 0.18), transparent 32rem),
       var(--page);
     color: var(--ink);
     font-size: 16px;
     line-height: 1.45;
     overscroll-behavior: none;
   }


   button { font: inherit; }


   .app-shell {
     width: min(1180px, 100%);
     min-height: 100dvh;
     margin: 0 auto;
     padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
       max(18px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
   }


   .topbar {
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 12px;
     min-height: 46px;
     margin-bottom: 12px;
   }


   .brand {
     display: flex;
     align-items: center;
     gap: 10px;
     font-weight: 800;
     letter-spacing: 0.09em;
   }


   .brand-mark {
     display: grid;
     width: 32px;
     height: 32px;
     place-items: center;
     border-radius: 50%;
     background: var(--accent);
     color: var(--accent-ink);
   }


   .brand-mark svg { width: 20px; height: 20px; }


   .state-chip {
     display: inline-flex;
     align-items: center;
     gap: 7px;
     max-width: 58vw;
     min-height: 34px;
     padding: 6px 11px;
     overflow: hidden;
     border: 1px solid var(--line);
     border-radius: 999px;
     background: rgba(13, 28, 23, 0.82);
     color: var(--muted);
     font-size: 0.82rem;
