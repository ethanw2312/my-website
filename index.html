<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>排球姿勢評分</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(11, 15, 20, .68);
    --text: #f3f6f9;
    --muted: #a9b4c0;
    --good: #3ddc97;
    --mid: #ffc247;
    --bad: #ff6b6b;
    --left: #ffc247;   /* 人體左側關節 */
    --right: #4cc9f0;  /* 人體右側關節 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  #stage { position: fixed; inset: 0; }
  /* 影片與骨架畫布使用相同的盒子與 object-fit，兩者永遠對齊 */
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* 自拍鏡頭只在「顯示」上鏡像；Landmark 仍取自未鏡像的原始影像 */
  #stage.mirror #video, #stage.mirror #overlay { transform: scaleX(-1); }

  #top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);
    pointer-events: none;
  }
  #pose {
    padding: .3em .85em; border-radius: 999px; background: var(--panel);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: clamp(18px, 5vmin, 30px); font-weight: 700; letter-spacing: .04em;
  }
  #score {
    pointer-events: auto; min-width: 2.1em; padding: .05em .3em; border-radius: 18px; background: var(--panel);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: clamp(44px, 14vmin, 96px); font-weight: 800; line-height: 1.1; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  [data-level="good"] { color: var(--good); }
  [data-level="mid"]  { color: var(--mid); }
  [data-level="bad"]  { color: var(--bad); }

  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 86vw; padding: .7em 1.2em; border-radius: 14px;
    background: rgba(255, 194, 71, .94); color: #1b1300;
    font-size: clamp(16px, 4.6vmin, 24px); font-weight: 700; text-align: center;
  }

  #breakdown {
    position: absolute; margin: 0; padding: 10px 12px; list-style: none;
    left: calc(env(safe-area-inset-left) + 12px); bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: min(72vw, 320px); border-radius: 14px; background: var(--panel);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: clamp(12px, 3.3vmin, 14px);
  }
  #breakdown li { display: grid; grid-template-columns: 6.4em 1fr 3.4em; align-items: center; gap: 8px; padding: 3px 0; }
  #breakdown .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); overflow: hidden; }
  #breakdown .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: currentColor; transition: width .25s; }
  #breakdown .pts { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  #switch {
    position: absolute; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 14px);
    width: 56px; height: 56px; border-radius: 50%; background: var(--panel);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: grid; place-items: center;
  }
  #switch svg { width: 28px; height: 28px; }
  #switch:active { transform: scale(.94); }

  #status {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; background: rgba(11, 15, 20, .78); text-align: center; font-size: clamp(16px, 4.4vmin, 22px);
  }
  #status p { margin: 0; }
  #statusBtn { padding: .6em 1.6em; border-radius: 999px; background: var(--good); color: #04130c; font-weight: 700; }

  @media (orientation: landscape) and (max-height: 480px) {
    #breakdown { width: min(44vw, 300px); padding: 6px 10px; }
    #breakdown li { padding: 1px 0; }
    #score { font-size: clamp(36px, 16vh, 72px); }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.wasm.min.js"></script>
</head>
<body>
<main id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <header id="top">
    <div id="pose" aria-live="polite">—</div>
    <button id="score" hidden aria-label="姿勢評分"></button>
  </header>

  <div id="hint" role="status" hidden></div>
  <ul id="breakdown" hidden></ul>

  <button id="switch" aria-label="切換鏡頭" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 13.5a2.8 2.8 0 0 1 4.8-1.6M14.5 13.5a2.8 2.8 0 0 1-4.8 1.6"/>
      <path d="M14.6 10.6v1.5h-1.5M9.4 16.4v-1.5h1.5"/>
    </svg>
  </button>

  <div id="status"><p id="statusText">載入中…</p><button id="statusBtn" hidden></button></div>
</main>

<script type="module">
// =====================================================================
// 設定
// =====================================================================
// 模型檔位置：可與網頁放在同一層，或放在 model 子資料夾（依序嘗試）
const MODEL_DIRS = ['./', './model/'];
const ORT_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/';
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2';
const POSE_MODEL_URLS = {
  lite:  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  full:  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
  heavy: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task',
};

// 分類頻率與平滑：不必每個影格都分類
const INFER_INTERVAL_MS = 200;  // 每 0.2 秒分類一次（5 Hz）
const VOTE_WINDOW = 7;          // 取最近 7 次分類結果投票
const VOTE_MIN_COUNT = 5;       // 同一類別至少 5 票才確認
const MIN_MEAN_PROB = 0.7;      // 且該類別平均機率 ≥ 0.7（機率只用來確認類別，不是評分）
const VOTE_MAX_AGE_MS = 8000;   // 超過 8 秒的舊結果不計（較慢的裝置分類頻率低，需保留較久）
const SCORE_SMOOTHING = 0.3;    // 評分指數平滑係數（越小越穩定）
const HINT_DELAY_MS = 500;      // 關節不完整持續超過此時間才提示

const ANGLES_USE_3D = false;    // 第一階段角度只用 X、Y；改 true 則用 MediaPipe 的 3D 世界座標
const MIN_FRONTAL_RATIO = 0.4;  // 肩寬 ÷ 軀幹長低於此值 = 沒有正面面向鏡頭（正面約 0.6~0.7），不評分

const POSE_NAMES = { spike: '扣球', serve: '發球', set: '托球', receive: '接球', idle: '非排球姿勢' };

// =====================================================================
// 特徵規格 ―― 必須與 train_pose_classifier.py 的「特徵規格」區塊完全一致
//   修改任何一項時兩邊都要一起改，FEATURE_VERSION 加 1 後重新訓練。
// =====================================================================
const FEATURE_VERSION = 1;

// 13 個 Landmark：[名稱, MediaPipe Pose 編號]，順序即特徵排列順序
const LANDMARKS = [
  ['nose', 0],             // 鼻子：頭部位置代表點
  ['left_shoulder', 11],
  ['right_shoulder', 12],
  ['left_elbow', 13],
  ['right_elbow', 14],
  ['left_wrist', 15],
  ['right_wrist', 16],
  ['left_hip', 23],
  ['right_hip', 24],
  ['left_knee', 25],
  ['right_knee', 26],
  ['left_ankle', 27],
  ['right_ankle', 28],
];

// 10 個關節距離：[A, B]，左配左、右配右，順序即特徵排列順序
const DISTANCE_PAIRS = [
  ['left_wrist', 'left_shoulder'],
  ['right_wrist', 'right_shoulder'],
  ['left_wrist', 'nose'],
  ['right_wrist', 'nose'],
  ['left_shoulder', 'right_shoulder'],
  ['left_elbow', 'left_shoulder'],
  ['right_elbow', 'right_shoulder'],
  ['left_knee', 'left_hip'],
  ['right_knee', 'right_hip'],
  ['left_wrist', 'right_wrist'],
];

const MIN_SCALE_PX = 1e-6;

const SLOT = Object.fromEntries(LANDMARKS.map(([name], i) => [name, i]));   // 名稱 → 13 點中的位置
const IDX = Object.fromEntries(LANDMARKS);                                  // 名稱 → MediaPipe 編號
const FEATURE_NAMES = [
  ...LANDMARKS.flatMap(([name]) => [`${name}_x`, `${name}_y`]),
  ...DISTANCE_PAIRS.map(([a, b]) => `dist_${a}__${b}`),
];

/**
 * 由 MediaPipe 的 33 個正規化 Landmark 建立 36 維特徵（與 Python extract_features() 相同）。
 *   1. x*寬、y*高 轉成像素座標 → 消除不同影像長寬比造成的變形
 *   2. 中心化：原點 = 左髖與右髖的中點
 *   3. 正規化：除以軀幹長度（肩膀中點到髖部中點的距離）
 *   4. 座標特徵：13 個點的 (x, y)，排成 x0,y0,x1,y1,...
 *   5. 距離特徵：用「正規化後」的 x、y 計算歐氏距離
 * lm 必須來自未鏡像的原始影像；只用 X、Y，不用 Z。
 */
function extractFeatures(lm, width, height) {
  const n = LANDMARKS.length;
  const px = new Float64Array(n), py = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const p = lm[LANDMARKS[i][1]];
    px[i] = p.x * width;
    py[i] = p.y * height;
  }
  const cx = (px[SLOT.left_hip] + px[SLOT.right_hip]) / 2;
  const cy = (py[SLOT.left_hip] + py[SLOT.right_hip]) / 2;
  const sx = (px[SLOT.left_shoulder] + px[SLOT.right_shoulder]) / 2;
  const sy = (py[SLOT.left_shoulder] + py[SLOT.right_shoulder]) / 2;
  const scale = Math.sqrt((sx - cx) * (sx - cx) + (sy - cy) * (sy - cy));
  if (!(scale > MIN_SCALE_PX)) return null;

  const nx = new Float64Array(n), ny = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    nx[i] = (px[i] - cx) / scale;
    ny[i] = (py[i] - cy) / scale;
  }
  const feats = new Float32Array(FEATURE_NAMES.length);
  for (let i = 0; i < n; i++) {
    feats[2 * i] = nx[i];
    feats[2 * i + 1] = ny[i];
  }
  DISTANCE_PAIRS.forEach(([a, b], k) => {
    const dx = nx[SLOT[a]] - nx[SLOT[b]];
    const dy = ny[SLOT[a]] - ny[SLOT[b]];
    feats[2 * n + k] = Math.sqrt(dx * dx + dy * dy);
  });
  return feats;
}

/** 可見度不足或超出畫面的 Landmark 名稱（與 Python missing_landmarks() 相同條件）。 */
function missingLandmarks(lm) {
  const minVis = meta?.minVisibility ?? 0.5;
  return LANDMARKS.filter(([, idx]) => {
    const p = lm[idx];
    return (p.visibility ?? 1) < minVis || p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1;
  }).map(([name]) => name);
}

// =====================================================================
// 姿勢評分規則（與分類分開；只有確認姿勢類別後才計算）
//   band = [0 分下限, 滿分下限, 滿分上限, 0 分上限]
//   量測值落在滿分區間 → 該項滿分；往外線性扣分，到 0 分界線為 0 分。
//   長度一律以「肩寬」為單位（正面視角下肩寬最穩定），角度單位為度。
//   以下數值為初始設定，請依實際拍攝結果校正。
// =====================================================================
const RECEIVE_RULES = [
  // 手腕到同側髖部的距離 ÷ 肩寬
  { key: 'wristHip', label: '手腕靠近髖部', weight: 25, band: [-Infinity, -Infinity, 0.6, 1.5] },
  // 兩手腕距離 ÷ 肩寬（一顆排球直徑約 21 cm ≈ 0.6 個肩寬）
  { key: 'handGap',  label: '雙手間距',     weight: 16, band: [0.1, 0.4, 0.85, 1.5] },
  // 左、右手肘彎曲角度（肩-肘-腕夾角，伸直為 180°）
  { key: 'elbow',    label: '手肘角度',     weight: 18, band: [90, 150, Infinity, Infinity] },
  // 兩手腕高度差 ÷ 肩寬
  { key: 'level',    label: '雙手等高',     weight: 11, band: [-Infinity, -Infinity, 0.1, 0.45] },
  // 兩手腕中點偏離身體中線的水平距離 ÷ 肩寬
  { key: 'center',   label: '雙手置中',     weight: 12, band: [-Infinity, -Infinity, 0.15, 0.6] },
  // (手腕高度 − 手肘高度) ÷ 肩寬；正值代表手腕比手肘低
  { key: 'wristLow', label: '手腕低於手肘', weight: 13, band: [-0.2, 0.05, Infinity, Infinity] },
  // 軀幹（肩中點-髖中點）與鉛直線的夾角；正面視角只能看出左右傾斜
  { key: 'torso',    label: '軀幹直立',     weight: 5,  band: [-Infinity, -Infinity, 8, 30] },
];

function bandScore(v, [zeroLo, fullLo, fullHi, zeroHi]) {
  if (v < fullLo) return v <= zeroLo ? 0 : (v - zeroLo) / (fullLo - zeroLo);
  if (v > fullHi) return v >= zeroHi ? 0 : (zeroHi - v) / (zeroHi - fullHi);
  return 1;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

/** 以 b 為頂點、a-b-c 的夾角（度）；點有 z 時為 3D 夾角。 */
function angleDeg(a, b, c) {
  const u = [a.x - b.x, a.y - b.y, (a.z ?? 0) - (b.z ?? 0)];
  const v = [c.x - b.x, c.y - b.y, (c.z ?? 0) - (b.z ?? 0)];
  const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const len = Math.hypot(...u) * Math.hypot(...v);
  if (!(len > 0)) return 180;
  return Math.acos(Math.min(1, Math.max(-1, dot / len))) * 180 / Math.PI;
}

/** 正面視角檢查：側身時肩寬在畫面上會明顯縮短，評分用的比例會失真。 */
function isFrontal(lm, width, height) {
  const P = name => ({ x: lm[IDX[name]].x * width, y: lm[IDX[name]].y * height });
  const LS = P('left_shoulder'), RS = P('right_shoulder');
  const torso = dist(mid(LS, RS), mid(P('left_hip'), P('right_hip')));
  return torso > 0 && dist(LS, RS) / torso >= MIN_FRONTAL_RATIO;
}

/** 接球姿勢的各項量測值；每個 key 對應 RECEIVE_RULES，陣列內為左、右或單一數值。 */
function measureReceive(lm, width, height, world) {
  const P = name => ({ x: lm[IDX[name]].x * width, y: lm[IDX[name]].y * height });  // 像素座標
  const LS = P('left_shoulder'), RS = P('right_shoulder');
  const LE = P('left_elbow'), RE = P('right_elbow');
  const LW = P('left_wrist'), RW = P('right_wrist');
  const LH = P('left_hip'), RH = P('right_hip');
  const SW = dist(LS, RS);  // 肩寬
  if (!(SW > 1)) return null;

  const shoulderMid = mid(LS, RS), hipMid = mid(LH, RH), wristMid = mid(LW, RW);
  const elbow = (s, e, w) => (ANGLES_USE_3D && world)
    ? angleDeg(world[IDX[s]], world[IDX[e]], world[IDX[w]])
    : angleDeg(P(s), P(e), P(w));

  return {
    wristHip: [dist(LW, LH) / SW, dist(RW, RH) / SW],
    handGap:  [dist(LW, RW) / SW],
    elbow:    [elbow('left_shoulder', 'left_elbow', 'left_wrist'), elbow('right_shoulder', 'right_elbow', 'right_wrist')],
    level:    [Math.abs(LW.y - RW.y) / SW],
    center:   [Math.abs(wristMid.x - (shoulderMid.x + hipMid.x) / 2) / SW],
    wristLow: [(LW.y - LE.y) / SW, (RW.y - RE.y) / SW],
    torso:    [Math.atan2(Math.abs(shoulderMid.x - hipMid.x), Math.abs(hipMid.y - shoulderMid.y)) * 180 / Math.PI],
  };
}

// 有評分規則的姿勢類別（類別名稱小寫）；Spike 目前只辨識、不評分
const SCORERS = {
  receive: { rules: RECEIVE_RULES, measure: measureReceive },
};

// =====================================================================
// 執行狀態
// =====================================================================
const $ = id => document.getElementById(id);
const stage = $('stage'), video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d');
const poseEl = $('pose'), scoreEl = $('score'), hintEl = $('hint'), breakdownEl = $('breakdown');
const switchBtn = $('switch'), statusEl = $('status'), statusText = $('statusText'), statusBtn = $('statusBtn');

let meta = null, session = null, landmarker = null;
let stream = null, facing = 'user', currentDeviceId = null, switching = false;
let looping = false, lastVideoTime = -1, lastInferAt = 0, inferBusy = false, badSince = 0, problemShown = false;
let votes = [], confirmed = null, smooth = null, smoothKey = null, epoch = 0, notice = '';
let showBreakdown = true;

function userError(message) { return Object.assign(new Error(message), { userMessage: message }); }

function setStatus(text, buttonLabel, onClick) {
  statusText.textContent = text ?? '';
  statusBtn.hidden = !buttonLabel;
  statusBtn.textContent = buttonLabel ?? '';
  statusBtn.onclick = onClick ?? null;
  statusEl.hidden = !text && !buttonLabel;
}

// =====================================================================
// 載入：分類模型（ONNX Runtime Web）與姿勢模型（MediaPipe）
// =====================================================================
async function loadClassifier() {
  if (!window.ort) throw userError('無法載入 ONNX Runtime，請確認網路連線');
  let dir = null, m = null;
  for (const d of MODEL_DIRS) {
    const res = await fetch(d + 'pose_meta.json', { cache: 'no-cache' }).catch(() => null);
    if (!res?.ok) continue;
    try { m = await res.json(); dir = d; break; } catch { /* 不是 JSON，試下一個位置 */ }
  }
  if (!m) throw userError('找不到 pose_meta.json，請確認檔案已上傳');
  if (m.featureVersion !== FEATURE_VERSION || JSON.stringify(m.featureNames) !== JSON.stringify(FEATURE_NAMES)) {
    throw userError('模型與網頁的特徵規格不一致，請重新訓練');
  }
  ort.env.wasm.wasmPaths = ORT_BASE;
  ort.env.wasm.numThreads = 1;
  const onnxRes = await fetch(`${dir}pose_classifier.onnx?v=${encodeURIComponent(m.createdAt ?? '')}`).catch(() => null);
  if (!onnxRes?.ok) throw userError('找不到 pose_classifier.onnx，請確認檔案已上傳');
  const s = await ort.InferenceSession.create(new Uint8Array(await onnxRes.arrayBuffer()), { executionProviders: ['wasm'] });
  meta = m;
  session = s;
  await selfTest();
}

async function runClassifier(features) {
  const input = new ort.Tensor('float32', features, [1, features.length]);
  const output = await session.run({ [meta.inputName]: input }, [meta.probabilityOutputName]);
  return Array.from(output[meta.probabilityOutputName].data);
}

/** 用訓練程式附的測試向量確認：網頁算出的特徵與 ONNX 機率和 Python 完全一致。 */
async function selfTest() {
  let featErr = 0, probErr = 0;
  for (const t of meta.selfTest ?? []) {
    const feats = extractFeatures(t.landmarks.map(([x, y]) => ({ x, y })), t.width, t.height);
    if (!feats) { featErr = Infinity; break; }
    t.features.forEach((v, i) => { featErr = Math.max(featErr, Math.abs(feats[i] - v) / Math.max(1, Math.abs(v))); });
    const probs = await runClassifier(feats);
    t.probabilities.forEach((v, i) => { probErr = Math.max(probErr, Math.abs(probs[i] - v)); });
  }
  console.info(`[selfTest] 特徵最大誤差 ${featErr.toExponential(2)}，機率最大誤差 ${probErr.toExponential(2)}`);
  if (!(featErr < 1e-4) || !(probErr < 1e-3)) {
    session = null;
    throw userError('特徵或模型自我檢查未通過，請重新訓練');
  }
}

async function loadPoseLandmarker() {
  const vision = await import(`${MP_BASE}/vision_bundle.mjs`).catch(() => null);
  if (!vision) throw userError('無法載入 MediaPipe，請確認網路連線');
  const fileset = await vision.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  const create = delegate => vision.PoseLandmarker.createFromOptions(fileset, {
    // 使用與訓練時相同的姿勢模型（記錄在 pose_meta.json）
    baseOptions: { modelAssetPath: POSE_MODEL_URLS[meta.poseModel] ?? POSE_MODEL_URLS.full, delegate },
    runningMode: 'VIDEO',
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
  try { landmarker = await create('GPU'); }
  catch { landmarker = await create('CPU'); }
}

// =====================================================================
// 攝影機：前後鏡頭切換
// =====================================================================
function stopCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
}

async function startCamera({ facing: wanted = 'user', deviceId } = {}) {
  if (!navigator.mediaDevices?.getUserMedia) throw userError('需以 HTTPS 或 localhost 開啟才能使用攝影機');
  stopCamera();
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  const constraints = deviceId
    ? { ...size, deviceId: { exact: deviceId } }
    : { ...size, facingMode: { ideal: wanted } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: constraints });
  } catch (err) {
    throw userError(err.name === 'NotAllowedError' ? '請允許使用攝影機' : '無法開啟攝影機');
  }
  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings?.() ?? {};
  currentDeviceId = settings.deviceId ?? null;
  // 以實際取得的鏡頭判斷前/後；無法判斷時視為自拍鏡頭
  const isBack = settings.facingMode
    ? settings.facingMode === 'environment'
    : /back|rear|environment|後/i.test(track.label);
  facing = isBack ? 'environment' : 'user';

  // 鏡像只影響「顯示」：姿勢偵測一律使用未鏡像的原始影像，左右關節定義不變
  stage.classList.toggle('mirror', facing === 'user');
  video.srcObject = stream;
  try {
    await video.play();
  } catch {
    await new Promise(resolve => setStatus('', '開始', () => video.play().finally(resolve)));
  }
  lastVideoTime = -1;
  resetRecognition();

  const cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  switchBtn.hidden = cameras.length < 2;
}

async function switchCamera() {
  if (switching || !landmarker) return;
  switching = true;
  const previousId = currentDeviceId, previousFacing = facing;
  try {
    await startCamera({ facing: previousFacing === 'user' ? 'environment' : 'user' });
    if (currentDeviceId && currentDeviceId === previousId) {
      // 裝置不支援 facingMode（筆電、部分平板）：改為依序切換攝影機
      const cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      if (cameras.length > 1) {
        const i = cameras.findIndex(d => d.deviceId === previousId);
        await startCamera({ deviceId: cameras[(i + 1) % cameras.length].deviceId });
      }
    }
  } catch (err) {
    console.error(err);
    try { await startCamera({ facing: previousFacing, deviceId: previousId ?? undefined }); }
    catch (err2) { setStatus(err2.userMessage ?? '無法開啟攝影機', '重試', init); }
  } finally {
    switching = false;
  }
}

// =====================================================================
// 主迴圈：每個影格偵測 Landmark；固定頻率分類；投票平滑
// =====================================================================
function resetRecognition() {
  epoch++;
  votes = [];
  confirmed = null;
  smooth = null;
  smoothKey = null;
  notice = '';
  poseEl.textContent = '—';
  renderScore(null);
}

function hintFor(missing) {
  if (missing.some(n => /ankle|knee/.test(n))) return '請後退，讓全身入鏡';
  if (missing.includes('nose')) return '請讓頭部入鏡';
  if (missing.some(n => /wrist|elbow/.test(n))) return '請讓雙手清楚入鏡';
  return '請調整位置，讓全身入鏡';
}

function loop() {
  requestAnimationFrame(loop);
  if (!stream || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const W = video.videoWidth, H = video.videoHeight;
  if (!W || !H) return;
  if (overlay.width !== W || overlay.height !== H) { overlay.width = W; overlay.height = H; }

  const now = performance.now();
  let result;
  try { result = landmarker.detectForVideo(video, now); }
  catch (err) { console.error(err); return; }

  const lm = result.landmarks?.[0];
  const missing = lm ? missingLandmarks(lm) : [];
  drawSkeleton(lm, W, H, missing);

  // 必要關節不完整：提示調整距離或位置，不分類也不評分
  const problem = !lm ? '請站到鏡頭前' : missing.length ? hintFor(missing) : '';
  if (problem) {
    if (!badSince) badSince = now;
    if (now - badSince > HINT_DELAY_MS) {
      if (!problemShown) { problemShown = true; resetRecognition(); }
      hintEl.textContent = problem;
      hintEl.hidden = false;
    }
    return;
  }
  badSince = 0;
  problemShown = false;
  hintEl.textContent = notice;
  hintEl.hidden = !notice;

  if (!inferBusy && now - lastInferAt >= INFER_INTERVAL_MS) {
    lastInferAt = now;
    classify(lm, W, H, result.worldLandmarks?.[0], now);
  }
}

async function classify(lm, W, H, world, now) {
  const features = extractFeatures(lm, W, H);
  if (!features) return;
  const myEpoch = epoch;
  inferBusy = true;
  try {
    // 步驟 1：Random Forest 只判斷姿勢類別
    const probs = await runClassifier(features);
    if (myEpoch !== epoch) return;
    let best = 0;
    for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
    votes.push({ t: now, cls: best, p: probs[best] });
    votes = votes.filter(v => now - v.t <= VOTE_MAX_AGE_MS).slice(-VOTE_WINDOW);
    confirmed = pickConfirmed();

    const label = confirmed == null ? null : meta.labels[confirmed];
    poseEl.textContent = label ? (POSE_NAMES[label.toLowerCase()] ?? label) : '—';

    // 步驟 2：確認類別後，才依該類別的規則計算關節角度並評分
    const scorer = label ? SCORERS[label.toLowerCase()] : null;
    notice = scorer && !isFrontal(lm, W, H) ? '請正面面向鏡頭' : '';
    if (!scorer || notice) { smooth = null; smoothKey = null; renderScore(null); return; }
    const values = scorer.measure(lm, W, H, world);
    if (!values) return;
    const items = scorer.rules.map(rule => {
      const scores = values[rule.key].map(v => bandScore(v, rule.band));
      return scores.reduce((a, b) => a + b, 0) / scores.length;
    });
    smooth = (smooth && smoothKey === label)
      ? smooth.map((s, i) => s + SCORE_SMOOTHING * (items[i] - s))
      : items;
    smoothKey = label;
    renderScore(scorer.rules, smooth);
  } catch (err) {
    console.error(err);
  } finally {
    inferBusy = false;
  }
}

/** 最近 VOTE_WINDOW 次結果中，票數與平均機率都達標的類別；否則 null（未確認）。 */
function pickConfirmed() {
  const tally = new Map();
  for (const v of votes) {
    const t = tally.get(v.cls) ?? { n: 0, sum: 0 };
    t.n++; t.sum += v.p;
    tally.set(v.cls, t);
  }
  for (const [cls, t] of tally) {
    if (t.n >= VOTE_MIN_COUNT && t.sum / t.n >= MIN_MEAN_PROB) return cls;
  }
  return null;
}

// =====================================================================
// 畫面
// =====================================================================
const level = x => (x >= 0.8 ? 'good' : x >= 0.6 ? 'mid' : 'bad');

function renderScore(rules, items) {
  if (!rules) { scoreEl.hidden = true; breakdownEl.hidden = true; return; }
  const totalWeight = rules.reduce((s, r) => s + r.weight, 0);
  const total = rules.reduce((s, r, i) => s + r.weight * items[i], 0) / totalWeight;
  scoreEl.textContent = Math.round(total * 100);
  scoreEl.dataset.level = level(total);
  scoreEl.hidden = false;

  if (breakdownEl.childElementCount !== rules.length) {
    breakdownEl.replaceChildren(...rules.map(rule => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="name"></span><span class="bar"><i></i></span><span class="pts"></span>';
      li.querySelector('.name').textContent = rule.label;
      return li;
    }));
  }
  rules.forEach((rule, i) => {
    const li = breakdownEl.children[i];
    const bar = li.querySelector('.bar');
    bar.dataset.level = level(items[i]);
    bar.firstElementChild.style.width = `${Math.round(items[i] * 100)}%`;
    li.querySelector('.pts').textContent = `${Math.round(items[i] * rule.weight)}/${rule.weight}`;
  });
  breakdownEl.hidden = !showBreakdown;
}

const BONES = [
  ['left_shoulder', 'right_shoulder'], ['left_hip', 'right_hip'],
  ['left_shoulder', 'left_elbow'], ['left_elbow', 'left_wrist'],
  ['right_shoulder', 'right_elbow'], ['right_elbow', 'right_wrist'],
  ['left_shoulder', 'left_hip'], ['right_shoulder', 'right_hip'],
  ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
  ['right_hip', 'right_knee'], ['right_knee', 'right_ankle'],
];
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLOR = { left: css('--left'), right: css('--right'), bad: css('--bad') };

function drawSkeleton(lm, W, H, missing) {
  ctx.clearRect(0, 0, W, H);
  if (!lm) return;
  const unit = Math.max(W, H) / 300;
  const at = name => [lm[IDX[name]].x * W, lm[IDX[name]].y * H];

  ctx.lineCap = 'round';
  ctx.lineWidth = unit;
  ctx.strokeStyle = 'rgba(255, 255, 255, .85)';
  ctx.beginPath();
  for (const [a, b] of BONES) { ctx.moveTo(...at(a)); ctx.lineTo(...at(b)); }
  ctx.stroke();

  for (const [name] of LANDMARKS) {
    const [x, y] = at(name);
    const isMissing = missing.includes(name);
    ctx.fillStyle = isMissing ? COLOR.bad : name.startsWith('left') ? COLOR.left : name.startsWith('right') ? COLOR.right : '#fff';
    ctx.beginPath();
    ctx.arc(x, y, unit * (isMissing ? 2.6 : 1.8), 0, Math.PI * 2);
    ctx.fill();
  }
}

// =====================================================================
// 啟動
// =====================================================================
async function init() {
  try {
    if (!session) { setStatus('載入模型…'); await loadClassifier(); }
    if (!landmarker) { setStatus('載入模型…'); await loadPoseLandmarker(); }
    setStatus('啟動攝影機…');
    await startCamera({ facing });
    setStatus('');
    navigator.wakeLock?.request('screen').catch(() => {});
    if (!looping) { looping = true; requestAnimationFrame(loop); }
  } catch (err) {
    console.error(err);
    setStatus(err.userMessage ?? '發生錯誤，請重新整理', '重試', init);
  }
}

switchBtn.addEventListener('click', switchCamera);
scoreEl.addEventListener('click', () => { showBreakdown = !showBreakdown; breakdownEl.hidden = !showBreakdown; });

// 從背景回到前景：攝影機若被系統關閉則重新開啟
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !landmarker || !statusEl.hidden) return;
  navigator.wakeLock?.request('screen').catch(() => {});
  const track = stream?.getVideoTracks()[0];
  if (!track || track.readyState === 'ended') init();
});

// 供開發時在主控台檢查用
window.poseApp = { extractFeatures, runClassifier, measureReceive, isFrontal, bandScore, RECEIVE_RULES, get meta() { return meta; } };

init();
</script>
